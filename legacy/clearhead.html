<title>Clearhead</title>
<meta name="description" content="Capture everything, see only what matters now.">

<style>
/* Clearhead — calm task manager.
   Layout: mobile-first single column with a thumb bar; at ≥900px a collapsible sidebar,
   the list, and a task detail panel side by side. One sans-serif (Inter), large bold titles,
   warm neutral ground, area colors only as small accents. */
:root {
  color-scheme: light;
  --bg: #f7f6f3;
  --surface: #ffffff;
  --surface-2: #f0efeb;
  --surface-3: #e7e5e0;
  --sidebar: #efeee9;
  --line: rgba(32, 30, 26, 0.09);
  --line-strong: rgba(32, 30, 26, 0.17);
  --ink: #1d1d1f;
  --ink-2: #5d5d63;
  --ink-3: #8c8c92;
  --ink-inv: #ffffff;
  --accent: #2f6ae8;
  --accent-ink: #ffffff;
  --accent-soft: rgba(47, 106, 232, 0.11);
  --danger: #cf3f3a;
  --danger-soft: rgba(207, 63, 58, 0.1);
  --warn: #b97a0a;
  --warn-soft: rgba(201, 138, 18, 0.12);
  --ok: #2a9455;
  --ok-soft: rgba(42, 148, 85, 0.12);
  --star: #f2b301;
  --shared: #6c55c9;
  --shared-tint: #f5f2fc;
  --shared-line: rgba(108, 85, 201, 0.2);
  --overlay: rgba(20, 20, 24, 0.32);
  --shadow-1: 0 1px 2px rgba(20, 20, 24, 0.05), 0 1px 1px rgba(20, 20, 24, 0.03);
  --shadow-2: 0 2px 6px rgba(20, 20, 24, 0.06), 0 10px 30px -10px rgba(20, 20, 24, 0.2);
  --shadow-3: 0 18px 60px -12px rgba(20, 20, 24, 0.35), 0 2px 8px rgba(20, 20, 24, 0.08);
  /* list icon colors (Inbox, Today, Upcoming ...) */
  --l-inbox: #2f86e8; --l-today: #f2b301; --l-upcoming: #e0453b; --l-anytime: #1f9488; --l-someday: #b08a5a;
  --l-waiting: #8a63d2; --l-logbook: #2a9455; --l-projects: #5b5fd6; --l-trash: #8c8c92;
  /* area palette */
  --c-blue: #2f6ae8; --c-sky: #1f8ccc; --c-teal: #13897d; --c-green: #2f9a55; --c-amber: #c48f0e; --c-orange: #df6d21;
  --c-red: #d6453c; --c-pink: #cf4b8b; --c-purple: #8a4fcb; --c-indigo: #5b56d6; --c-brown: #92684a; --c-slate: #64748b;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --r-sm: 8px; --r: 12px; --r-lg: 16px; --r-xl: 22px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --t-fast: 150ms; --t: 220ms;
  --tabbar-h: 62px;
  --sidebar-w: 264px;
  --detail-w: 420px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #18191b; --surface: #202124; --surface-2: #2a2b2f; --surface-3: #34363a; --sidebar: #141517;
    --line: rgba(255, 255, 255, 0.075); --line-strong: rgba(255, 255, 255, 0.14);
    --ink: #ededef; --ink-2: #a8a9ae; --ink-3: #77787e; --ink-inv: #111;
    --accent: #5d8ff3; --accent-ink: #0b1220; --accent-soft: rgba(93, 143, 243, 0.16);
    --danger: #ee6b62; --danger-soft: rgba(238, 107, 98, 0.14); --warn: #e3ae3f; --warn-soft: rgba(227, 174, 63, 0.14);
    --ok: #4fc27f; --ok-soft: rgba(79, 194, 127, 0.14); --star: #f6c431;
    --shared: #a593f2; --shared-tint: rgba(150, 128, 240, 0.075); --shared-line: rgba(165, 147, 242, 0.22);
    --overlay: rgba(0, 0, 0, 0.55);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3); --shadow-2: 0 2px 8px rgba(0, 0, 0, 0.35), 0 12px 30px -10px rgba(0, 0, 0, 0.6);
    --shadow-3: 0 20px 60px -10px rgba(0, 0, 0, 0.7);
    --l-inbox: #4d9bf0; --l-today: #f6c431; --l-upcoming: #f06a60; --l-anytime: #36b5a7; --l-someday: #c9a273;
    --l-waiting: #a688ec; --l-logbook: #4fc27f; --l-projects: #8487f0; --l-trash: #8c8c92;
    --c-blue: #6492f5; --c-sky: #4fb0e8; --c-teal: #37b8aa; --c-green: #55c27c; --c-amber: #e2b23d; --c-orange: #f08d4a;
    --c-red: #f06f66; --c-pink: #ec7fb2; --c-purple: #b48af0; --c-indigo: #8c88f2; --c-brown: #c29673; --c-slate: #94a3b8;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #18191b; --surface: #202124; --surface-2: #2a2b2f; --surface-3: #34363a; --sidebar: #141517;
  --line: rgba(255, 255, 255, 0.075); --line-strong: rgba(255, 255, 255, 0.14);
  --ink: #ededef; --ink-2: #a8a9ae; --ink-3: #77787e; --ink-inv: #111;
  --accent: #5d8ff3; --accent-ink: #0b1220; --accent-soft: rgba(93, 143, 243, 0.16);
  --danger: #ee6b62; --danger-soft: rgba(238, 107, 98, 0.14); --warn: #e3ae3f; --warn-soft: rgba(227, 174, 63, 0.14);
  --ok: #4fc27f; --ok-soft: rgba(79, 194, 127, 0.14); --star: #f6c431;
  --shared: #a593f2; --shared-tint: rgba(150, 128, 240, 0.075); --shared-line: rgba(165, 147, 242, 0.22);
  --overlay: rgba(0, 0, 0, 0.55);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3); --shadow-2: 0 2px 8px rgba(0, 0, 0, 0.35), 0 12px 30px -10px rgba(0, 0, 0, 0.6);
  --shadow-3: 0 20px 60px -10px rgba(0, 0, 0, 0.7);
  --l-inbox: #4d9bf0; --l-today: #f6c431; --l-upcoming: #f06a60; --l-anytime: #36b5a7; --l-someday: #c9a273;
  --l-waiting: #a688ec; --l-logbook: #4fc27f; --l-projects: #8487f0; --l-trash: #8c8c92;
  --c-blue: #6492f5; --c-sky: #4fb0e8; --c-teal: #37b8aa; --c-green: #55c27c; --c-amber: #e2b23d; --c-orange: #f08d4a;
  --c-red: #f06f66; --c-pink: #ec7fb2; --c-purple: #b48af0; --c-indigo: #8c88f2; --c-brown: #c29673; --c-slate: #94a3b8;
}
/* Accent choices (Settings). Each sets the accent for both themes. */
:root[data-accent="indigo"] { --accent: #5b56d6; --accent-soft: rgba(91, 86, 214, 0.12); }
:root[data-accent="teal"] { --accent: #13897d; --accent-soft: rgba(19, 137, 125, 0.12); }
:root[data-accent="green"] { --accent: #2f9a55; --accent-soft: rgba(47, 154, 85, 0.12); }
:root[data-accent="orange"] { --accent: #d4621c; --accent-soft: rgba(212, 98, 28, 0.12); }
:root[data-accent="pink"] { --accent: #c9447f; --accent-soft: rgba(201, 68, 127, 0.12); }
:root[data-accent="slate"] { --accent: #4a5363; --accent-soft: rgba(74, 83, 99, 0.12); }
@media (prefers-color-scheme: dark) {
  :root[data-accent="indigo"]:not([data-theme="light"]) { --accent: #8c88f2; --accent-soft: rgba(140, 136, 242, 0.16); }
  :root[data-accent="teal"]:not([data-theme="light"]) { --accent: #37b8aa; --accent-soft: rgba(55, 184, 170, 0.16); }
  :root[data-accent="green"]:not([data-theme="light"]) { --accent: #55c27c; --accent-soft: rgba(85, 194, 124, 0.16); }
  :root[data-accent="orange"]:not([data-theme="light"]) { --accent: #f08d4a; --accent-soft: rgba(240, 141, 74, 0.16); }
  :root[data-accent="pink"]:not([data-theme="light"]) { --accent: #ec7fb2; --accent-soft: rgba(236, 127, 178, 0.16); }
  :root[data-accent="slate"]:not([data-theme="light"]) { --accent: #a9b4c6; --accent-soft: rgba(169, 180, 198, 0.16); }
}
:root[data-theme="dark"][data-accent="indigo"] { --accent: #8c88f2; --accent-soft: rgba(140, 136, 242, 0.16); }
:root[data-theme="dark"][data-accent="teal"] { --accent: #37b8aa; --accent-soft: rgba(55, 184, 170, 0.16); }
:root[data-theme="dark"][data-accent="green"] { --accent: #55c27c; --accent-soft: rgba(85, 194, 124, 0.16); }
:root[data-theme="dark"][data-accent="orange"] { --accent: #f08d4a; --accent-soft: rgba(240, 141, 74, 0.16); }
:root[data-theme="dark"][data-accent="pink"] { --accent: #ec7fb2; --accent-soft: rgba(236, 127, 178, 0.16); }
:root[data-theme="dark"][data-accent="slate"] { --accent: #a9b4c6; --accent-soft: rgba(169, 180, 198, 0.16); }

/* ---------------------------------------------------------------- base */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-feature-settings: "cv11", "ss01";
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--accent-soft); }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.ink2 { color: var(--ink-2); }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 15px; height: 15px; }
svg.i.xs { width: 13px; height: 13px; stroke-width: 2; }
svg.i.lg { width: 22px; height: 22px; }
svg.i.xl { width: 30px; height: 30px; stroke-width: 1.5; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }

/* ---------------------------------------------------------------- shell */
#app { height: 100%; }
.shell { display: flex; height: 100%; min-height: 0; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
.scroller { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
.page { max-width: 760px; margin: 0 auto; padding-inline: 20px; padding-block: 4px calc(var(--tabbar-h) + 110px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 900px) { .page { padding-inline: 40px; padding-block: 8px 120px; } }

.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; height: 52px; padding-inline: 12px;
  background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid transparent; transition: border-color var(--t);
}
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar-title { flex: 1; min-width: 0; text-align: center; font-weight: 650; font-size: 15px; opacity: 0; transform: translateY(4px); transition: opacity var(--t), transform var(--t); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar.scrolled .topbar-title { opacity: 1; transform: none; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); transition: background var(--t-fast); flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.active { color: var(--accent); }
.icon-btn.ghost-space { visibility: hidden; }

.page-head { display: flex; align-items: flex-end; gap: 12px; padding: 10px 0 18px; }
.page-head .ph-icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--c, var(--accent)); flex: none; margin-bottom: 3px; }
.page-head .ph-icon svg.i { width: 28px; height: 28px; stroke-width: 2; }
.page-title { font-size: 30px; line-height: 1.12; font-weight: 750; letter-spacing: -0.025em; margin: 0; text-wrap: balance; flex: 1; min-width: 0; word-break: break-word; }
.page-sub { color: var(--ink-3); font-size: 14px; margin-top: 4px; }
.head-actions { display: flex; gap: 4px; align-items: center; margin-bottom: 2px; }
@media (min-width: 900px) { .page-title { font-size: 32px; } }

/* sidebar */
.sidebar {
  width: var(--sidebar-w); flex: none; background: var(--sidebar); border-right: 1px solid var(--line); height: 100%;
  display: none; flex-direction: column; transition: margin-left var(--t) var(--ease);
}
@media (min-width: 900px) { .sidebar { display: flex; } .shell.sb-collapsed .sidebar { margin-left: calc(-1 * var(--sidebar-w)); } }
.sb-top { display: flex; align-items: center; gap: 10px; padding: 14px 14px 6px 18px; height: 56px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; letter-spacing: -0.01em; flex: 1; }
.brand-mark { width: 24px; height: 24px; }
.sb-scroll { flex: 1; overflow-y: auto; padding: 6px 10px 16px; }
.sb-group { margin-top: 18px; }
.sb-label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 650; color: var(--ink-3); padding: 0 10px 6px; letter-spacing: .01em; }
.sb-item {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 9px; color: var(--ink); font-size: 14.5px;
  text-align: left; position: relative; min-height: 34px; transition: background var(--t-fast);
}
.sb-item:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.sb-item.active { background: color-mix(in srgb, var(--ink) 8.5%, transparent); font-weight: 600; }
.sb-item .sb-ic { color: var(--c, var(--ink-3)); display: flex; }
.sb-item .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-item .count { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.sb-item.sub { padding-left: 34px; font-size: 14px; color: var(--ink-2); min-height: 30px; }
.sb-item.sub.active { color: var(--ink); }
.new-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--shared); flex: none; }
.sb-foot { padding: 10px; border-top: 1px solid var(--line); display: flex; gap: 4px; align-items: center; }
.sb-foot .me { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; font-size: 13.5px; padding: 6px 8px; border-radius: 9px; }
.sb-foot .me:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }

/* detail panel (desktop) */
.detail-pane { width: var(--detail-w); flex: none; border-left: 1px solid var(--line); background: var(--surface); height: 100%; overflow-y: auto; display: none; }
@media (min-width: 1100px) { .detail-pane { display: block; } }
@media (min-width: 900px) and (max-width: 1099px) { .detail-pane { display: block; position: fixed; right: 0; top: 0; bottom: 0; z-index: 40; box-shadow: var(--shadow-3); } }

/* bottom tab bar (mobile) */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: space-around; align-items: stretch;
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px);
  background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.5) blur(18px); -webkit-backdrop-filter: saturate(1.5) blur(18px);
  border-top: 1px solid var(--line);
}
@media (min-width: 900px) { .tabbar { display: none; } }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 550; color: var(--ink-3); position: relative; min-height: 44px; }
.tab svg.i { width: 23px; height: 23px; }
.tab.active { color: var(--accent); }
.tab .badge { position: absolute; top: 7px; left: calc(50% + 6px); min-width: 17px; height: 17px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 10.5px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }
.fab {
  position: fixed; right: 18px; bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 31;
  width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
  box-shadow: 0 6px 20px -4px color-mix(in srgb, var(--accent) 55%, transparent), var(--shadow-1); transition: transform var(--t-fast) var(--ease);
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.fab:active { transform: scale(.92); }
.fab svg.i { width: 26px; height: 26px; stroke-width: 2.2; }
@media (min-width: 900px) { .fab { bottom: 28px; right: 28px; } .shell.has-detail .fab { right: calc(var(--detail-w) + 28px); } }
@media (min-width: 900px) and (max-width: 1099px) { .shell.has-detail .fab { right: 28px; } }

/* ---------------------------------------------------------------- task rows */
.list { display: flex; flex-direction: column; }
.task {
  position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 9px 10px; margin-inline: -10px; border-radius: 10px;
  min-height: 44px; cursor: default; user-select: none; -webkit-user-select: none; transition: background var(--t-fast), opacity var(--t), transform var(--t) var(--ease);
  background: var(--bg);
}
.task:hover { background: color-mix(in srgb, var(--ink) 3.5%, var(--bg)); }
.task.selected { background: var(--accent-soft); }
.task.multi { background: color-mix(in srgb, var(--accent) 16%, var(--bg)); }
.task .t-body { flex: 1; min-width: 0; padding-top: 1px; cursor: pointer; }
.task .t-title { font-size: 15.5px; line-height: 1.38; word-break: break-word; }
.task .t-title .imp { color: var(--warn); margin-right: 5px; vertical-align: -2px; display: inline-flex; }
.task .t-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 3px; font-size: 12.5px; color: var(--ink-3); }
.task .t-meta .m { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.task .t-meta .m.due { color: var(--ink-2); }
.task .t-meta .m.due.soon { color: var(--warn); }
.task .t-meta .m.due.late { color: var(--danger); }
.task .t-meta .m.home .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--ink-3)); flex: none; }
.task .t-meta .m.shared { color: var(--shared); }
.task .t-meta .ctx { color: var(--ink-3); }
.task .t-right { display: flex; align-items: center; gap: 6px; padding-top: 1px; }
.task.done .t-title { color: var(--ink-3); }
.task.is-done-anim .t-title { color: var(--ink-3); transition: color var(--t); }
.task.leaving { opacity: 0; transform: translateX(14px); }
.task.collapsing { overflow: hidden; }
.task.preview { opacity: .55; }
.task.preview .t-title { font-style: normal; }
.task.dragging-src { opacity: .35; }
.task.stuck .t-title::after { content: ""; }
.list-row-wrap { position: relative; overflow: hidden; border-radius: 10px; margin-inline: -10px; }
.list-row-wrap > .task { margin-inline: 0; }
.swipe-under { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-weight: 600; font-size: 13.5px; color: #fff; }
.swipe-under .left { display: flex; align-items: center; gap: 6px; }
.swipe-under .right { display: flex; align-items: center; gap: 6px; }
.swipe-under.complete { background: var(--ok); }
.swipe-under.schedule { background: var(--accent); justify-content: flex-end; }
.drag-ghost { position: fixed; z-index: 200; pointer-events: none; background: var(--surface); box-shadow: var(--shadow-3); border-radius: 10px; opacity: .96; transform: rotate(-1deg); padding: 9px 14px; font-size: 15px; max-width: 80vw; }
.drop-line { height: 2px; background: var(--accent); border-radius: 2px; margin: -1px 4px; position: relative; z-index: 2; }
.drop-zone-hot { background: var(--accent-soft) !important; border-radius: 10px; }

/* checkbox */
.check {
  width: 22px; height: 22px; border-radius: 50%; border: 1.6px solid var(--line-strong); flex: none; position: relative; display: grid; place-items: center;
  margin-top: 1px; transition: border-color var(--t-fast), background var(--t-fast); background: var(--surface);
}
.check::before { content: ""; position: absolute; inset: -10px; }
.check:hover { border-color: var(--accent); }
.check.imp { border-color: color-mix(in srgb, var(--warn) 70%, var(--line-strong)); }
.check.shared { border-color: color-mix(in srgb, var(--shared) 55%, var(--line-strong)); }
.check svg { width: 13px; height: 13px; stroke: var(--accent-ink); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset 260ms var(--ease) 60ms; }
.check.on { background: var(--accent); border-color: var(--accent); animation: pop 360ms var(--ease); }
.check.on svg { stroke-dashoffset: 0; }
.check.on.done-muted { background: var(--ink-3); border-color: var(--ink-3); animation: none; }
.check.sq { border-radius: 6px; width: 19px; height: 19px; }
@keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(.82); } 70% { transform: scale(1.14); } 100% { transform: scale(1); } }

/* ---------------------------------------------------------------- sections and groups */
.section { margin-top: 26px; }
.section:first-child { margin-top: 6px; }
.sec-head { display: flex; align-items: center; gap: 8px; padding-bottom: 7px; margin-bottom: 4px; border-bottom: 1px solid var(--line); font-weight: 650; font-size: 15px; }
.sec-head .sec-ic { color: var(--c, var(--ink-3)); display: flex; }
.sec-head .grow { flex: 1; min-width: 0; }
.sec-head .aside { font-size: 12.5px; font-weight: 500; color: var(--ink-3); }
.sec-head.big { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; border-bottom: 0; padding-bottom: 2px; }
.sec-head.day { align-items: baseline; }
.sec-head.day .daynum { font-size: 26px; font-weight: 750; letter-spacing: -0.03em; min-width: 34px; font-variant-numeric: tabular-nums; }
.sec-head.day .dayname { font-size: 15px; font-weight: 650; }
.sec-head.day .daydate { font-size: 13px; color: var(--ink-3); font-weight: 500; }
.empty-day { color: var(--ink-3); font-size: 13.5px; padding: 6px 0 4px; }
.collapsible-btn { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-3); font-size: 13px; }

.overdue-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 14px 6px; margin-bottom: 8px; }
.overdue-box .sec-head { border-bottom: 0; padding-top: 8px; margin-bottom: 0; cursor: pointer; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.card-pad { padding: 14px 16px; }

/* coming up */
.coming { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.nudge {
  display: flex; align-items: center; gap: 12px; padding: 11px 12px 11px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  text-align: left; width: 100%; transition: border-color var(--t-fast), background var(--t-fast);
}
.nudge:hover { border-color: var(--line-strong); }
.nudge .n-ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--c, var(--accent)) 14%, transparent); color: var(--c, var(--accent)); flex: none; }
.nudge .n-body { flex: 1; min-width: 0; }
.nudge .n-title { font-weight: 600; font-size: 14.5px; }
.nudge .n-sub { font-size: 13px; color: var(--ink-3); }
.nudge.shared { background: var(--shared-tint); border-color: var(--shared-line); }

/* ---------------------------------------------------------------- buttons, chips, inputs */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 15px; border-radius: 10px; font-weight: 600; font-size: 14px;
  background: var(--surface-2); color: var(--ink); transition: background var(--t-fast), transform var(--t-fast); white-space: nowrap;
}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.btn.ghost { background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { color: var(--danger); }
.btn.big { height: 50px; font-size: 15.5px; border-radius: 13px; padding: 0 20px; }
.btn.sm { height: 32px; padding: 0 11px; font-size: 13px; border-radius: 8px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; pointer-events: none; }
.link-btn { color: var(--accent); font-weight: 550; font-size: 14px; }
.link-btn:hover { text-decoration: underline; }

.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 11px; border-radius: 15px; font-size: 13.5px; font-weight: 550;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid transparent; white-space: nowrap; transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
}
.chip:hover { color: var(--ink); }
.chip.on { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.chip.tok { height: 26px; padding: 0 6px 0 9px; border-radius: 7px; font-size: 12.5px; gap: 3px; background: var(--accent-soft); color: var(--accent); }
.chip.tok.when, .chip.tok.time, .chip.tok.tod { background: color-mix(in srgb, var(--l-today) 18%, transparent); color: color-mix(in srgb, var(--l-today) 55%, var(--ink)); }
.chip.tok.due { background: var(--danger-soft); color: var(--danger); }
.chip.tok.project, .chip.tok.area { background: color-mix(in srgb, var(--l-projects) 14%, transparent); color: var(--l-projects); }
.chip.tok.context { background: var(--surface-2); color: var(--ink-2); }
.chip.tok.important { background: var(--warn-soft); color: var(--warn); }
.chip.tok.repeat { background: color-mix(in srgb, var(--l-anytime) 14%, transparent); color: var(--l-anytime); }
.chip.tok.assignee { background: var(--shared-tint); color: var(--shared); }
.chip.tok.unresolved { opacity: .6; text-decoration: line-through; }
.chip.tok button { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; opacity: .7; }
.chip.tok button:hover { opacity: 1; background: color-mix(in srgb, currentColor 14%, transparent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 550; }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 600; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.shared { background: var(--shared-tint); color: var(--shared); border: 1px solid var(--shared-line); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.muted { background: var(--surface-2); color: var(--ink-3); }

.input, .textarea, .select {
  width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 9px 12px; font-size: 15px; outline: none;
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.input:focus, .textarea:focus, .select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.textarea { resize: none; line-height: 1.5; }
.input.bare, .textarea.bare { border: 0; padding: 0; background: transparent; box-shadow: none; border-radius: 0; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .lbl { font-size: 12.5px; font-weight: 600; color: var(--ink-3); }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { height: 30px; padding: 0 12px; border-radius: 8px; font-size: 13.5px; font-weight: 550; color: var(--ink-2); white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.toggle { width: 44px; height: 26px; border-radius: 13px; background: var(--surface-3); position: relative; flex: none; transition: background var(--t-fast); }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform var(--t) var(--ease); }
.toggle.on { background: var(--accent); }
.toggle.on::after { transform: translateX(18px); }

/* avatars */
.av { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; flex: none; background: var(--surface-3); display: inline-grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; overflow: hidden; }
.av.sm { width: 18px; height: 18px; font-size: 9px; }
.av.lg { width: 32px; height: 32px; font-size: 13px; }
.av.either { background: var(--surface-2); color: var(--ink-3); border: 1px dashed var(--line-strong); }
.av-stack { display: inline-flex; }
.av-stack .av { box-shadow: 0 0 0 2px var(--sidebar); }
.av-stack .av + .av { margin-left: -6px; }
.shared-badge { display: inline-flex; align-items: center; gap: 6px; color: var(--shared); }

/* progress ring */
.ring { flex: none; transform: rotate(-90deg); }
.ring .bg { stroke: color-mix(in srgb, var(--c, var(--accent)) 22%, transparent); }
.ring .fg { stroke: var(--c, var(--accent)); transition: stroke-dashoffset 500ms var(--ease); }
.ring .pie { fill: var(--c, var(--accent)); }

/* ---------------------------------------------------------------- overlays */
.overlay { position: fixed; inset: 0; z-index: 100; background: var(--overlay); animation: fade var(--t) var(--ease); }
@keyframes fade { from { opacity: 0; } }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 101; background: var(--surface); border-radius: var(--r-xl) var(--r-xl) 0 0; box-shadow: var(--shadow-3);
  max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; animation: sheet-up 260ms var(--ease);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet.tall { height: calc(100% - 36px - env(safe-area-inset-top, 0px)); }
@keyframes sheet-up { from { transform: translateY(100%); } }
.sheet-grab { width: 38px; height: 5px; border-radius: 3px; background: var(--surface-3); margin: 8px auto 2px; flex: none; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 20px; flex: none; }
.sheet-head h3 { margin: 0; font-size: 17px; font-weight: 700; flex: 1; letter-spacing: -0.01em; }
.sheet-body { overflow-y: auto; padding: 4px 20px 20px; flex: 1; min-height: 0; }
.sheet-foot { padding: 10px 20px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex: none; }
@media (min-width: 700px) {
  .sheet { left: 50%; right: auto; bottom: auto; top: 12vh; transform: translateX(-50%); width: min(480px, calc(100vw - 40px)); border-radius: var(--r-lg); max-height: 76vh; animation: pop-in 200ms var(--ease); padding-bottom: 0; }
  .sheet.wide { width: min(640px, calc(100vw - 40px)); }
  .sheet.tall { height: auto; max-height: 82vh; top: 8vh; }
  .sheet-grab { display: none; }
  .sheet-head { padding-top: 14px; }
  @keyframes pop-in { from { opacity: 0; transform: translateX(-50%) translateY(8px) scale(.98); } }
}
.menu { position: fixed; z-index: 120; min-width: 220px; max-width: min(320px, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-2); padding: 5px; animation: fade 120ms ease; max-height: 70vh; overflow-y: auto; }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border-radius: 8px; font-size: 14.5px; text-align: left; color: var(--ink); min-height: 38px; }
.menu-item:hover, .menu-item.kbd-on { background: var(--surface-2); }
.menu-item .mi-ic { color: var(--ink-3); display: flex; }
.menu-item.danger, .menu-item.danger .mi-ic { color: var(--danger); }
.menu-item .hint { margin-left: auto; color: var(--ink-3); font-size: 12.5px; }
.menu-sep { height: 1px; background: var(--line); margin: 5px 6px; }
.menu-label { font-size: 12px; font-weight: 650; color: var(--ink-3); padding: 8px 10px 4px; }

.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 86px + env(safe-area-inset-bottom, 0px)); z-index: 150; display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(460px, calc(100vw - 24px)); pointer-events: none; }
@media (min-width: 900px) { .toasts { bottom: 28px; } }
body.dragging .toasts { opacity: .25; transition: opacity 120ms; } body.dragging .toast { pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; background: #26272b; color: #f2f2f4; padding: 10px 10px 10px 16px; border-radius: 12px; box-shadow: var(--shadow-3); font-size: 14px; width: 100%; animation: toast-in 240ms var(--ease); }
:root[data-theme="dark"] .toast { background: #3a3b40; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toast { background: #3a3b40; } }
.toast .grow { line-height: 1.35; }
.toast button { color: #9db8ff; font-weight: 650; padding: 6px 10px; border-radius: 8px; }
.toast button:hover { background: rgba(255,255,255,.08); }
.toast.error { background: #5b1f1c; }
.toast.warn .t-ic { color: #f3c55b; }
@keyframes toast-in { from { opacity: 0; transform: translateY(10px); } }

/* full-screen flows (process inbox, plan my day, review, focus...) */
.flow { position: fixed; inset: 0; z-index: 90; background: var(--bg); display: flex; flex-direction: column; animation: fade 200ms ease; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.flow-top { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 12px; flex: none; }
.flow-top .ft-title { flex: 1; text-align: center; font-weight: 650; font-size: 15px; color: var(--ink-2); }
.flow-body { flex: 1; overflow-y: auto; padding: 8px 20px 24px; }
.flow-inner { max-width: 620px; margin: 0 auto; }
.flow-foot { flex: none; padding: 12px 20px 16px; border-top: 1px solid var(--line); background: var(--bg); }
.flow-foot .flow-inner { display: flex; gap: 10px; }
.steps { display: flex; gap: 5px; justify-content: center; }
.steps i { width: 7px; height: 7px; border-radius: 4px; background: var(--surface-3); transition: width var(--t) var(--ease), background var(--t); }
.steps i.on { width: 20px; background: var(--accent); }
.steps i.done { background: color-mix(in srgb, var(--accent) 45%, var(--surface-3)); }
.flow h2 { font-size: 28px; line-height: 1.15; letter-spacing: -0.025em; margin: 18px 0 6px; font-weight: 750; text-wrap: balance; }
.flow .lede { color: var(--ink-2); font-size: 16px; margin: 0 0 22px; max-width: 52ch; }

/* process inbox card */
.proc-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 24px 22px; box-shadow: var(--shadow-2); touch-action: pan-y; transition: transform 200ms var(--ease), opacity 200ms; }
.proc-card .pc-title { font-size: 23px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; }
.proc-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.proc-actions .btn { height: 54px; justify-content: flex-start; padding: 0 16px; border-radius: 14px; font-size: 15px; background: var(--surface); border: 1px solid var(--line); }
.proc-actions .btn:hover { border-color: var(--line-strong); background: var(--surface); }
.proc-actions .btn .bi { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
.proc-actions .btn.wide { grid-column: 1 / -1; }
.swipe-hint { display: flex; justify-content: space-between; color: var(--ink-3); font-size: 12.5px; margin-top: 12px; padding: 0 4px; }

/* quick add */
.qa { padding: 16px 18px 12px; }
.qa-mirror-wrap { position: relative; }
.qa-mirror, .qa-input { font-size: 18px; line-height: 1.45; padding: 2px 0; white-space: pre-wrap; word-wrap: break-word; font-family: var(--font); letter-spacing: normal; }
.qa-mirror { position: absolute; inset: 0; color: transparent; pointer-events: none; overflow: hidden; }
body.dragging .tod-empty { display: block; }
.tod-empty { display: none; min-height: 36px; border: 1.5px dashed var(--line-strong); border-radius: 10px; margin: 4px 0; }
.qa-mirror mark { color: transparent; background: var(--accent-soft); border-radius: 4px; box-shadow: 0 0 0 2px var(--accent-soft); }
.qa-mirror mark.when, .qa-mirror mark.time, .qa-mirror mark.tod { background: color-mix(in srgb, var(--l-today) 22%, transparent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--l-today) 22%, transparent); }
.qa-mirror mark.due { background: var(--danger-soft); box-shadow: 0 0 0 2px var(--danger-soft); }
.qa-mirror mark.repeat { background: color-mix(in srgb, var(--l-anytime) 16%, transparent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--l-anytime) 16%, transparent); }
.qa-mirror mark.important { background: var(--warn-soft); box-shadow: 0 0 0 2px var(--warn-soft); }
.qa-mirror mark.assignee { background: var(--shared-tint); box-shadow: 0 0 0 2px var(--shared-line); }
.qa-input { width: 100%; border: 0; outline: none; background: transparent; resize: none; position: relative; color: var(--ink); caret-color: var(--accent); display: block; min-height: 30px; }
.qa-input::placeholder { color: var(--ink-3); }
.qa-tools { display: flex; align-items: center; gap: 2px; padding: 6px 10px 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.qa-dest { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); padding: 0 6px; }
.qa-hint { font-size: 12.5px; color: var(--ink-3); padding: 8px 0 0; line-height: 1.55; }
.qa-hint code { font-family: var(--font); font-weight: 650; color: var(--ink-2); background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
.dump { width: 100%; min-height: 260px; font-size: 17px; line-height: 1.7; border: 0; outline: none; background: transparent; resize: vertical; padding: 0; }
.recording { color: var(--danger) !important; animation: pulse 1.2s ease infinite; }
@keyframes pulse { 50% { opacity: .45; } }

/* detail */
.detail { padding: 18px 22px 40px; }
.detail .d-top { display: flex; align-items: flex-start; gap: 12px; }
.detail .d-title { font-size: 20px; font-weight: 650; line-height: 1.35; letter-spacing: -0.012em; width: 100%; border: 0; outline: none; background: transparent; resize: none; padding: 0; overflow: hidden; }
.detail .d-notes { margin-top: 10px; min-height: 24px; font-size: 15px; color: var(--ink); line-height: 1.55; }
.detail .d-notes .placeholder { color: var(--ink-3); }
.notes-md p { margin: 0 0 8px; }
.notes-md ul { margin: 0 0 8px; padding-left: 20px; }
.notes-md h4 { margin: 10px 0 4px; font-size: 15px; }
.notes-md .md-check { display: flex; gap: 8px; align-items: flex-start; }
.notes-md a { word-break: break-all; }
.props { margin-top: 18px; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.prop { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 6px 2px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; font-size: 14.5px; }
.prop .p-ic { color: var(--ink-3); display: flex; width: 20px; justify-content: center; }
.prop .p-label { color: var(--ink-3); width: 96px; flex: none; font-size: 13.5px; }
.prop .p-val { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.prop .p-val.placeholder { color: var(--ink-3); }
.prop .p-x { color: var(--ink-3); opacity: .7; }
button.prop:hover { background: color-mix(in srgb, var(--ink) 2.5%, transparent); }
.subtasks { margin-top: 14px; }
.subtask { display: flex; align-items: center; gap: 10px; min-height: 36px; }
.subtask input { flex: 1; border: 0; outline: none; background: transparent; font-size: 14.5px; padding: 6px 0; }
.subtask.done input { color: var(--ink-3); text-decoration: line-through; }
.d-block { margin-top: 22px; }
.d-block-head { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 13.5px; color: var(--ink-2); margin-bottom: 8px; }
.photos { display: flex; gap: 8px; flex-wrap: wrap; }
.photo { width: 84px; height: 84px; border-radius: 10px; overflow: hidden; background: var(--surface-2); position: relative; flex: none; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-add { width: 84px; height: 84px; border-radius: 10px; border: 1.5px dashed var(--line-strong); display: grid; place-items: center; color: var(--ink-3); }
.lightbox { position: fixed; inset: 0; z-index: 160; background: rgba(0,0,0,.88); display: flex; align-items: center; justify-content: center; padding: 20px; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
.comment { display: flex; gap: 10px; padding: 8px 0; }
.comment .c-body { flex: 1; min-width: 0; font-size: 14.5px; }
.comment .c-meta { font-size: 12px; color: var(--ink-3); }
.history { font-size: 12.5px; color: var(--ink-3); line-height: 1.7; }
.d-foot { display: flex; gap: 6px; margin-top: 26px; flex-wrap: wrap; }
.stuck-box { background: var(--warn-soft); border-radius: var(--r); padding: 12px 14px; margin-top: 14px; font-size: 14px; }
.stuck-box .row { margin-top: 8px; }

/* projects */
.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.proj-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 15px 16px; display: flex; flex-direction: column; gap: 10px; text-align: left; transition: border-color var(--t-fast), box-shadow var(--t-fast), transform var(--t-fast); min-width: 0; }
.proj-card:hover { border-color: var(--line-strong); box-shadow: var(--shadow-1); }
.proj-card.shared { background: linear-gradient(var(--shared-tint), var(--shared-tint)), var(--surface); border-color: var(--shared-line); }
.proj-card .pc-top { display: flex; align-items: center; gap: 10px; }
.proj-card .pc-name { font-weight: 650; font-size: 16px; flex: 1; min-width: 0; letter-spacing: -0.01em; }
.proj-card .pc-area { font-size: 12.5px; color: var(--ink-3); display: flex; align-items: center; gap: 5px; }
.proj-card .pc-next { font-size: 13.5px; color: var(--ink-2); display: flex; gap: 6px; align-items: flex-start; }
.proj-card .pc-next .lbl2 { color: var(--ink-3); flex: none; }
.proj-card .pc-foot { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); flex-wrap: wrap; }
.proj-row { display: flex; align-items: center; gap: 12px; padding: 10px; margin-inline: -10px; border-radius: 10px; text-align: left; width: calc(100% + 20px); }
.proj-row:hover { background: color-mix(in srgb, var(--ink) 3.5%, transparent); }
.proj-row .pr-name { font-weight: 600; flex: 1; min-width: 0; }
.outcome { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 14px; }
.outcome .o-lbl { font-size: 12px; font-weight: 650; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; }
.next-up { background: color-mix(in srgb, var(--c, var(--accent)) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c, var(--accent)) 22%, transparent); border-radius: var(--r); padding: 6px 14px 6px; margin-bottom: 8px; }
.next-up .nu-lbl { font-size: 12px; font-weight: 650; color: var(--c, var(--accent)); text-transform: uppercase; letter-spacing: .06em; padding-top: 6px; }
.stalled { display: inline-flex; align-items: center; gap: 5px; color: var(--warn); font-size: 12.5px; font-weight: 600; }
.meta-line { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--ink-3); font-size: 13.5px; margin: -8px 0 16px; align-items: center; }
.meta-line .m { display: inline-flex; align-items: center; gap: 5px; }
.client-card { display: grid; gap: 6px; font-size: 14px; }
.client-card a, .client-card .cl { display: inline-flex; align-items: center; gap: 8px; }

/* areas & shared */
.area-shared-head { background: var(--shared-tint); border: 1px solid var(--shared-line); border-radius: var(--r); padding: 10px 14px; display: flex; align-items: center; gap: 10px; margin: -6px 0 16px; font-size: 13.5px; color: var(--ink-2); flex-wrap: wrap; }
.activity { display: flex; flex-direction: column; }
.act { display: flex; gap: 10px; padding: 8px 0; font-size: 14px; align-items: flex-start; border-bottom: 1px solid var(--line); }
.act:last-child { border-bottom: 0; }
.act .a-body { flex: 1; min-width: 0; color: var(--ink-2); }
.act .a-body b { color: var(--ink); font-weight: 600; }
.act .a-time { font-size: 12px; color: var(--ink-3); white-space: nowrap; }

/* groceries */
.groc-row { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 12px; margin-inline: -12px; border-radius: 12px; user-select: none; -webkit-user-select: none; cursor: pointer; transition: background var(--t-fast), opacity var(--t); }
.groc-row:hover { background: color-mix(in srgb, var(--ink) 3.5%, transparent); }
.groc-row .check { width: 26px; height: 26px; }
.groc-row .g-title { font-size: 17px; flex: 1; min-width: 0; }
.groc-row.done .g-title { color: var(--ink-3); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ink-3) 60%, transparent); }
.groc-row .g-by { font-size: 12px; color: var(--ink-3); }
.groc-add { display: flex; gap: 8px; margin-bottom: 14px; }
.groc-add .input { height: 48px; font-size: 16px; }

/* settings */
.set-group { margin-bottom: 28px; }
.set-group h3 { font-size: 13px; font-weight: 650; color: var(--ink-3); margin: 0 0 8px; text-transform: uppercase; letter-spacing: .06em; }
.set-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.set-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); min-height: 52px; flex-wrap: wrap; }
.set-row:last-child { border-bottom: 0; }
.set-row .sr-label { flex: 1; min-width: 160px; }
.set-row .sr-sub { font-size: 12.5px; color: var(--ink-3); }
.swatch { width: 26px; height: 26px; border-radius: 50%; background: var(--c); border: 2px solid transparent; box-shadow: inset 0 0 0 2px var(--surface); }
.swatch.on { border-color: var(--c); }
.icon-pick { display: grid; grid-template-columns: repeat(auto-fill, 40px); gap: 6px; }
.icon-pick button { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-2); }
.icon-pick button.on { background: var(--accent-soft); color: var(--accent); }

/* calendar picker */
.cal { user-select: none; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 6px; font-weight: 650; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.cal-grid .wd { font-size: 11.5px; color: var(--ink-3); font-weight: 600; padding: 4px 0; }
.cal-grid button { height: 38px; border-radius: 10px; font-size: 14px; font-variant-numeric: tabular-nums; position: relative; }
.cal-grid button:hover { background: var(--surface-2); }
.cal-grid button.out { color: var(--ink-3); opacity: .5; }
.cal-grid button.today { color: var(--accent); font-weight: 700; }
.cal-grid button.sel { background: var(--accent); color: var(--accent-ink); font-weight: 650; }
.cal-grid button.past { color: var(--ink-3); }
.quick-dates { display: flex; flex-direction: column; margin: 0 -8px 8px; }
.quick-dates button { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 10px; font-size: 15px; text-align: left; }
.quick-dates button:hover { background: var(--surface-2); }
.quick-dates .qd-ic { display: flex; color: var(--c, var(--ink-3)); }
.quick-dates .qd-side { margin-left: auto; color: var(--ink-3); font-size: 13px; }

/* empty states */
.empty { text-align: center; padding: 56px 20px 40px; color: var(--ink-3); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .e-art { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--c, var(--accent)) 10%, transparent); color: var(--c, var(--accent)); margin-bottom: 6px; }
.empty .e-art svg.i { width: 40px; height: 40px; stroke-width: 1.5; }
.empty .e-title { color: var(--ink); font-weight: 650; font-size: 17px; }
.empty .e-sub { font-size: 14.5px; max-width: 36ch; }
.allclear { text-align: center; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.allclear svg.art { width: 180px; height: 120px; }
.allclear .e-title { font-size: 21px; font-weight: 700; letter-spacing: -0.015em; }
.allclear .e-sub { color: var(--ink-3); }

/* filters bar */
.filters { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 12px; margin: -6px 0 6px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }

/* command palette */
.palette { position: fixed; z-index: 130; left: 50%; top: 12vh; transform: translateX(-50%); width: min(600px, calc(100vw - 24px)); background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-3); border: 1px solid var(--line); overflow: hidden; animation: pop-in2 160ms var(--ease); }
@keyframes pop-in2 { from { opacity: 0; transform: translateX(-50%) scale(.98); } }
.palette input { width: 100%; border: 0; outline: none; padding: 16px 18px; font-size: 17px; background: transparent; border-bottom: 1px solid var(--line); }
.palette .p-list { max-height: 56vh; overflow-y: auto; padding: 6px; }

/* bulk bar */
.bulkbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-3); border-radius: 16px; padding: 6px; display: flex; gap: 2px; align-items: center; max-width: calc(100vw - 20px); overflow-x: auto; animation: toast-in 200ms var(--ease); }
@media (min-width: 900px) { .bulkbar { bottom: 28px; } }
.bulkbar .b-count { font-weight: 650; font-size: 13.5px; padding: 0 10px; white-space: nowrap; }
.bulkbar .btn { height: 36px; padding: 0 10px; background: transparent; }
.bulkbar .btn:hover { background: var(--surface-2); }

/* focus mode */
.focus { position: fixed; inset: 0; z-index: 95; background: var(--bg); display: flex; flex-direction: column; animation: fade 250ms ease; padding-top: env(safe-area-inset-top, 0px); }
.focus-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 20px; }
.focus-inner { width: 100%; max-width: 560px; margin: auto 0; padding: 20px 0 40px; }
.focus .f-title { font-size: 30px; font-weight: 750; letter-spacing: -0.025em; line-height: 1.2; text-align: center; text-wrap: balance; }
.timer { font-size: 64px; font-weight: 300; letter-spacing: -0.03em; text-align: center; font-variant-numeric: tabular-nums; margin: 26px 0 6px; }
.timer-phase { text-align: center; color: var(--ink-3); font-size: 14px; }

/* misc */
.kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
.divider { height: 1px; background: var(--line); margin: 16px 0; }
.center-screen { height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
.loader { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--surface-3); border-top-color: var(--accent); animation: spin 800ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.skeleton-row { height: 18px; border-radius: 6px; background: var(--surface-2); margin: 16px 0; animation: pulse 1.4s ease infinite; }
.onboard-art { width: 120px; height: 120px; margin: 10vh auto 10px; display: grid; place-items: center; border-radius: 34px; background: var(--accent-soft); color: var(--accent); }
.onboard-art svg.i { width: 56px; height: 56px; stroke-width: 1.4; }
.word-list { display: grid; gap: 8px; }
.word-list .wl-item { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.more-list { display: flex; flex-direction: column; gap: 2px; }
.more-item { display: flex; align-items: center; gap: 14px; padding: 12px 10px; margin-inline: -10px; border-radius: 12px; font-size: 16px; text-align: left; width: calc(100% + 20px); }
.more-item:hover { background: color-mix(in srgb, var(--ink) 3.5%, transparent); }
.more-item .mi-ic { color: var(--c, var(--ink-3)); display: flex; }
.more-item .grow { flex: 1; }
.more-head { font-size: 13px; font-weight: 650; color: var(--ink-3); margin: 22px 0 6px; text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: 8px; }
.offline-pill { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); left: 50%; transform: translateX(-50%); z-index: 140; }
.big-num { font-size: 40px; font-weight: 750; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.summary-grid .card { padding: 14px; }
.budget-bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin: 10px 0 6px; }
.budget-bar span { display: block; height: 100%; border-radius: 4px; background: var(--ok); transition: width 400ms var(--ease); }
.budget-bar span.over { background: var(--warn); }
.notes-editor { min-height: 160px; }
.mt { margin-top: 14px; } .mt-s { margin-top: 8px; } .mt-l { margin-top: 24px; }

/* iOS zooms into inputs under 16px; keep every field at 16px on touch screens. */
@media (pointer: coarse) {
  .input, .textarea, .select, .subtask input, .qa-input, .qa-mirror { font-size: 16px; }
  .qa-input, .qa-mirror { font-size: 18px; }
}
.focus-proxy { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; font-size: 16px; border: 0; padding: 0; pointer-events: none; }

/* ---- refinements after phone review ---- */
.task { background: transparent; }
.list-row-wrap > .task { background: var(--bg); }
.nudge { padding: 8px 8px 8px 12px; }
.nudge .n-ic { width: 30px; height: 30px; }
.nudge .n-title, .nudge .n-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nudge .n-body { min-width: 0; overflow: hidden; }
.nudge > button.row { min-width: 0; }
.area-shared-head > .grow { min-width: 200px; }
.sec-head.day.is-empty { color: var(--ink-3); border-bottom-color: transparent; }
.sec-head.day.is-empty .daynum { font-size: 20px; }
.d-notes .placeholder, .notes-md .placeholder { color: var(--ink-3); }
.notes-editor { min-height: 48px; }
.qa-tools { flex-wrap: nowrap; }
.qa-tools .icon-btn { width: 36px; height: 36px; }
.qa-dest-btn { max-width: 42%; min-width: 0; overflow: hidden; }
.qa-dest-btn .dest-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
@media (max-width: 699px) {
  .sheet { bottom: var(--kb, 0px); }
  .sheet.qa-sheet { top: calc(env(safe-area-inset-top, 0px) + 8px); bottom: auto; left: 8px; right: 8px; border-radius: var(--r-lg); animation: sheet-down 220ms var(--ease); max-height: calc(100% - 16px); padding-bottom: 0; }
  .sheet.qa-sheet .sheet-grab { display: none; }
  @keyframes sheet-down { from { transform: translateY(-30px); opacity: 0; } }
}

.tod-dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom, 0px)); z-index: 70; display: none; gap: 8px; }
@media (min-width: 900px) { .tod-dock { bottom: 32px; } }
body.dragging .tod-dock { display: flex; }
.dock-pill { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line-strong); box-shadow: var(--shadow-2); font-size: 13.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.dock-pill.drop-zone-hot { background: var(--accent) !important; color: var(--accent-ink); border-color: var(--accent); }

.list-row-wrap { position: relative; border-radius: 10px; margin-inline: -10px; }
.list-row-wrap.swiping { overflow: hidden; }
.list-row-wrap > .task { margin-inline: 0; position: relative; z-index: 1; }
.list-row-wrap.swiping > .task { background: var(--bg); }
.swipe-under { z-index: 0; }

.toasts.in-flow { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 60px); }

/* brain dump about one thing */
.ramble-focus { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r); background: color-mix(in srgb, var(--c, var(--accent)) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c, var(--accent)) 20%, transparent); margin-top: 6px; }
.ramble-focus .rf-ic { color: var(--c); display: flex; }
.ramble-focus .grow { display: flex; flex-direction: column; min-width: 0; }
.ramble-focus b { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rf-kind { font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.ramble-box { min-height: 38vh; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; line-height: 1.6; }
.ramble-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ramble-list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.ramble-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ramble-row .check { margin-top: 4px; }
.ramble-title { width: 100%; border: 0; outline: none; background: transparent; resize: none; font-size: 16px; line-height: 1.4; padding: 2px 0 4px; overflow: hidden; }
.ramble-row .chip.tok > button:first-child { width: auto; height: auto; }

@media (max-width: 599px) { .btn .btn-label { display: none; } .btn:has(.btn-label) { padding: 0 9px; } }

/* ---------------------------------------------------------------- evenings, phone-free days */
.pill.offday { background: color-mix(in srgb, var(--l-waiting) 14%, transparent); color: var(--l-waiting); margin-left: 6px; }
.dnd-card { margin: 18px auto 0; max-width: 440px; text-align: left; }
.dnd-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none;
  background: color-mix(in srgb, var(--l-waiting) 14%, transparent); color: var(--l-waiting); }
.dnd-how { margin-top: 10px; font-size: 14px; line-height: 1.45; display: grid; gap: 6px; }
.day-planner .dp-date { font-size: 13px; color: var(--ink-3); font-weight: 600; margin-bottom: 2px; }
.dp-list { border-top: 1px solid var(--line); }
.dp-row { display: flex; align-items: center; gap: 8px; min-height: 52px; border-bottom: 1px solid var(--line); }
.dp-title { font-size: 15.5px; line-height: 1.3; padding: 6px 0; }
.dp-when { font-size: 13px; }
.dp-star { color: var(--ink-3); }
.dp-star svg { transition: transform 160ms var(--ease); }
.dp-row.starred .dp-star { color: var(--l-today, #e8a400); }
.dp-row.starred .dp-star svg { fill: currentColor; transform: scale(1.08); }
.dp-row.starred .dp-title { font-weight: 600; }
.dp-repeats .dp-row { color: var(--ink-3); min-height: 44px; }

/* The quiet screen takes the whole window, calm and dim. */
.quiet-shell { display: block; }
.quiet { min-height: 100dvh; overflow-y: auto; background: var(--bg);
  padding: calc(env(safe-area-inset-top, 0px) + 40px) 16px calc(env(safe-area-inset-bottom, 0px) + 40px); }
.quiet-inner { max-width: 520px; margin: 0 auto; }
.quiet-head { text-align: center; margin-bottom: 22px; }
.quiet-ic { width: 64px; height: 64px; border-radius: 22px; display: inline-grid; place-items: center; margin-bottom: 14px;
  background: color-mix(in srgb, var(--l-waiting) 13%, transparent); color: var(--l-waiting); }
.quiet-ic svg { width: 30px; height: 30px; }
.quiet-head h1 { font-size: 27px; letter-spacing: -0.02em; margin: 0 0 6px; }
.quiet-head p { margin: 0; color: var(--ink-2); font-size: 16px; line-height: 1.45; }
.quiet .dnd-card { margin: 0 0 14px; max-width: none; }
.quiet-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px 8px; }
.quiet-day { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.quiet-day span:first-child { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 700; }
.quiet-day b { font-size: 17px; }
.q-label { font-size: 12.5px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; margin: 14px 0 2px; }
.q-row { display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.q-row:last-child { border-bottom: 0; }
.q-row.faint { color: var(--ink-3); }
.q-row.done .q-title { text-decoration: line-through; color: var(--ink-3); }
.q-title { display: block; font-size: 16px; line-height: 1.35; }
.q-meta { display: block; font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.q-dot { width: 22px; height: 22px; flex: none; display: grid; place-items: center; margin-top: 1px; color: var(--ink-3); }
.q-dot:empty::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--l-waiting); opacity: .55; }
.q-check { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid var(--line-strong, var(--ink-3)); margin-top: 1px; display: grid; place-items: center; color: #fff; }
.q-check.on { background: var(--l-logbook); border-color: var(--l-logbook); }
.q-empty { padding: 22px 0 18px; text-align: center; color: var(--ink-3); }
.quiet-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.quiet-open { display: block; margin: 22px auto 0; font-size: 14px; color: var(--ink-3); }

/* ---------------------------------------------------------------- calendar events */
.ev-list { margin: 4px 0 14px; display: grid; gap: 2px; }
.ev-head { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; margin: 4px 0 4px; }
.ev-row { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 10px 6px 0; border-radius: 10px; color: var(--ink); text-decoration: none; background: var(--surface); border: 1px solid var(--line); }
.ev-row:hover { border-color: var(--line-strong, var(--line)); }
.ev-row.past { opacity: .5; }
.ev-row.now { border-color: color-mix(in srgb, var(--accent) 45%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 25%, transparent); }
.ev-bar { width: 4px; align-self: stretch; border-radius: 0 3px 3px 0; flex: none; }
.ev-time { width: 64px; flex: none; font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; line-height: 1.2; }
.ev-end { font-weight: 450; color: var(--ink-3); font-size: 12px; }
.ev-body { flex: 1; min-width: 0; }
.ev-title { display: block; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
.ev-loc { display: block; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-nowpill { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); flex: none; }
.ev-list.quiet { margin: 12px 0 4px; }
.ev-row.quiet { background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding-left: 0; }
.cal-notice { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.cal-ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
.cal-ic.warn { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.cal-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.ev-row, .ev-row:hover, .ev-row * { text-decoration: none; }
.ev-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ev-row { padding-right: 0; }
.ev-link { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; align-self: stretch; color: inherit; }
.ev-more { flex: none; color: var(--ink-3); width: 36px; height: 36px; }
.sort-prompt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; margin: 0 0 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: 14.5px; }
.sort-list { border-top: 1px solid var(--line); margin-top: 8px; }
.sort-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.sort-title { font-size: 15.5px; line-height: 1.3; }
.sort-when { font-size: 13px; }
.cal-filter { gap: 6px; margin-top: 6px; cursor: pointer; }
.ev-wrap { position: relative; border-radius: 10px; }
.ev-under { position: absolute; inset: 0; border-radius: 10px; display: flex; align-items: center; gap: 6px; padding: 0 16px; font-size: 14px; font-weight: 650;
  color: var(--ink-3); background: var(--surface-2, var(--line)); }
.ev-under.armed { background: var(--danger); color: #fff; }
.ev-wrap:not(:has(.swiping)) .ev-under { visibility: hidden; }
.ev-row { position: relative; transition: transform 160ms var(--ease); }
.ev-row.swiping { transition: none; }
