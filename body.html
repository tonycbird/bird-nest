<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Body · Bird Nest</title>
  <style>html{background:#F4F5F8}html[data-theme="dark"]{background:#1B1E26}</style>
  <!-- Same look as the app around it (the app also sets this live when the sun comes up or goes down). -->
  <script>try{var t=parent.document.documentElement.dataset.theme;if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
  <!-- The Body tab. Bird Fitness runs here unchanged, inside Nest, with Nest's database and look. -->
  <div id="app"><main id="view"></main></div>
  <nav id="tabbar" class="tabbar" aria-label="Fitness"></nav>
  <div id="timer" class="timer" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="sheet" hidden></div>
  <div id="player" hidden></div>
  <script type="module" src="/src/body/main.ts"></script>
</body>
</html>
