<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nest" />
    <meta name="theme-color" content="#F4F5F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1E26" media="(prefers-color-scheme: dark)" />
    <!-- Light by day, dark at night: start in the look the app last used, so there's no flash. -->
    <script>try{var m=localStorage.getItem("nest:theme-mode")||localStorage.getItem("nest:theme-now");if(m==="light"||m==="dark")document.documentElement.dataset.theme=m;}catch(e){}</script>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Bird Nest</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Rescue screen: if the app hasn't drawn anything after a few seconds, show what went wrong
         and two ways out. "Reset app files" clears cached code only; your data stays on the phone. -->
    <script>
      (function () {
        var errs = [];
        function add(m) { if (errs.length < 6) errs.push(String(m).slice(0, 400)); }
        addEventListener("error", function (e) { add((e.message || "Error") + (e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : "")); });
        addEventListener("unhandledrejection", function (e) { var r = e.reason; add("Promise: " + ((r && (r.stack || r.message)) || r)); });
        // A script or style file that fails to load doesn't raise a normal error; catch it here.
        addEventListener("error", function (e) { var t = e.target; if (t && t !== window && (t.src || t.href)) add("Didn't load: " + (t.src || t.href).split("/").pop()); }, true);
        window.__nestErrors = errs;
        function reset() {
          var sw = navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : Promise.resolve();
          sw.then(function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : 0; })
            .then(function () { location.reload(); }, function () { location.reload(); });
        }
        window.__nestRescue = function (why) {
          if (document.getElementById("rescue")) return;
          var d = document.createElement("div");
          d.id = "rescue";
          d.style.cssText = "position:fixed;inset:0;z-index:99;overflow:auto;padding:calc(24px + env(safe-area-inset-top)) 20px 24px;background:#F4F5F8;color:#171A23;font:15px/1.45 -apple-system,system-ui,sans-serif";
          var list = errs.length ? errs.map(function (x) { return "<li style='margin:6px 0;word-break:break-word'>" + x.replace(/</g, "&lt;") + "</li>"; }).join("") : "<li>No error message was caught.</li>";
          d.innerHTML = "<h2 style='margin:0 0 6px'>Nest didn't start</h2><p style='margin:0 0 10px'>" + (why || "") + " Take a screenshot of this for Claude.</p><ol style='padding-left:20px;font:12px/1.4 ui-monospace,Menlo,monospace'>" + list + "</ol>" +
            "<p style='font-size:12px;color:#646B7D'>" + navigator.userAgent + "</p>" +
            "<button id='rs1' style='display:block;width:100%;margin:14px 0 8px;padding:14px;border:0;border-radius:100px;background:#16A394;color:#fff;font-size:16px;font-weight:700'>Reload</button>" +
            "<button id='rs2' style='display:block;width:100%;padding:14px;border:0;border-radius:100px;background:#ECEEF3;color:#171A23;font-size:16px;font-weight:700'>Reset app files (keeps your data)</button>";
          document.body.appendChild(d);
          document.getElementById("rs1").onclick = function () { location.reload(); };
          document.getElementById("rs2").onclick = reset;
        };
        setTimeout(function () {
          var r = document.getElementById("root");
          if (r && r.textContent && r.textContent.trim()) return;
          // Usually a stale copy of the app's files. Fix it once on its own; if that didn't help, show this screen.
          var last = 0; try { last = +localStorage.getItem("nest:auto-reset") || 0; } catch (x) {}
          if (Date.now() - last > 10 * 60 * 1000) { try { localStorage.setItem("nest:auto-reset", String(Date.now())); } catch (x) {} reset(); return; }
          window.__nestRescue("The screen stayed empty.");
        }, 7000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
